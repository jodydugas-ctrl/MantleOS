[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mantle-daemon-laboratory"
version = "0.1.0"
description = "A local, Git-native Mantle Daemon continuity experiment"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mantle-daemon = "daemon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["daemon*"]

