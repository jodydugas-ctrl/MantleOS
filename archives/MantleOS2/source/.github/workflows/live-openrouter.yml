name: Manual OpenRouter gate

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model identifier
        required: true
        default: openrouter/free

permissions:
  contents: read

jobs:
  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-provider
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Resolve certified Hermes commit
        id: lock
        shell: python
        run: |
          import json
          import os
          commit = json.load(open("examples/hermes/upstream.lock.json", encoding="utf-8"))["commit"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"commit={commit}\n")
      - name: Construct disposable opt-in example NEST
        run: |
          git clone https://github.com/nousresearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout "${{ steps.lock.outputs.commit }}"
          mantle delta apply examples/hermes/seed --destination "$RUNNER_TEMP/hermes-agent"
      - name: Prepare Food without logging the credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model }}
        shell: python
        run: |
          import os
          from pathlib import Path
          if not os.environ.get("OPENROUTER_API_KEY"):
              raise SystemExit("OPENROUTER_API_KEY is not configured")
          Path(os.environ["RUNNER_TEMP"], "hermes-agent", "Food.txt").write_text(
              os.environ["OPENROUTER_API_KEY"] + "\n" + os.environ["OPENROUTER_MODEL"] + "\n",
            encoding="utf-8",
          )
      - name: Generate and approve disposable test Personality
        run: |
          mantle --nest "$RUNNER_TEMP/hermes-agent" primer generate --food "$RUNNER_TEMP/hermes-agent/Food.txt" --context "Disposable CI organism for provider-boundary verification only."
          mantle --nest "$RUNNER_TEMP/hermes-agent" primer approve --approve-primer
      - name: Birth disposable CI organism
        run: mantle --nest "$RUNNER_TEMP/hermes-agent" birth --name "CI Disposable" --approve-birth
      - name: Digest and verify Food
        run: mantle --nest "$RUNNER_TEMP/hermes-agent" digest "$RUNNER_TEMP/hermes-agent/Food.txt"
      - name: Verify VCW integrity
        run: mantle --nest "$RUNNER_TEMP/hermes-agent" verify
