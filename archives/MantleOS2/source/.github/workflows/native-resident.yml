name: Native resident lifecycle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native resident / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Prepare disposable Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Real native registration and encrypted disposable Body
        env:
          MANTLE_NATIVE_SERVICE_TESTS: "1"
        shell: pwsh
        run: >-
          python -m pytest tests/test_resident_native.py -q -s --tb=short
          --basetemp "$env:RUNNER_TEMP/mantle-native-test"
          --junitxml "$env:RUNNER_TEMP/mantle-native-report.xml"
      - name: Retain test results only; never upload organism state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-resident-${{ matrix.os }}
          path: ${{ runner.temp }}/mantle-native-report.xml
          if-no-files-found: warn
