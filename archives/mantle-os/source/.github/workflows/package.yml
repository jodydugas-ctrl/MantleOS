name: Package and release evidence

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install build==1.4.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
      - name: Clean-environment wheel smoke
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install dist/*.whl
          .package-smoke/bin/python -m mantle --help
          .package-smoke/bin/python -c "import mantle; assert mantle.__version__ == '2.0.0rc1'"
      - name: Hash artifacts and scan release surface
        run: |
          mkdir -p artifacts
          python tools/release_manifest.py --dist dist --out artifacts/release-manifest.json
          python tools/release_scan.py --include dist --include artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mantle-os-2.0.0rc1-distributions
          path: |
            dist/*
            artifacts/release-manifest.json
          if-no-files-found: error
