name: KPP verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check exact source and common definitions
        run: |
          python tools/verify_release.py
          python tools/verify_shared.py
      - name: Test the kitchen
        run: python -m unittest discover -s tests -q
      - name: Check the CLI and adaptive example
        run: |
          python -m kpp doctor
          python examples/adaptive-reflex/smoke.py
      - name: Generate and verify experimental native REFLEX examples
        run: python examples/reflex_book/qualify.py --output .work/ci-reflex --examples-only
      - name: Build and install the distribution
        run: |
          python -m pip install build==1.3.0 setuptools==80.9.0
          python -m build --no-isolation
      - name: Verify the wheel in a fresh environment outside the checkout
        shell: bash
        run: python tools/check_reflex_install.py --wheel dist/*.whl --output "${{ runner.temp }}/reflex-installed-${{ matrix.python }}"
      - name: Retain installed-wheel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflex-installed-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/reflex-installed-${{ matrix.python }}/report.json
            ${{ runner.temp }}/reflex-installed-${{ matrix.python }}/*.stdout
            ${{ runner.temp }}/reflex-installed-${{ matrix.python }}/*.stderr
            ${{ runner.temp }}/reflex-installed-${{ matrix.python }}/work/demo/*
          if-no-files-found: ignore
