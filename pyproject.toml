[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mantleos-unified"
version = "0.1.0a8"
description = "Portable living software: deterministic Body, composable tissue, governed adaptation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "LicenseRef-MantleOS-Private"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{name = "Jody Dugas"}]
dependencies = []

[project.optional-dependencies]
dev = ["build==1.3.0", "setuptools==80.9.0"]

[project.scripts]
mantleos = "mantleos.console:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mantleos = ["**/*.json", "**/*.txt", "**/*.md", "**/*.anchor", "**/*.html", "**/*.js", "**/*.cjs", "**/*.css", "**/*.ui", "**/*.py", "**/LICENSE"]
