const menus=$('menus');for(const [head,items] of Object.entries(MENU)){const wrap=document.createElement('div');wrap.className='menuwrap';wrap.innerHTML='<button class="menutop" type="button">'+head+'</button><div class="dropdown"></div>';wrap.querySelector('button').addEventListener('click',e=>{e.stopPropagation();const was=wrap.classList.contains('open');closeMenus();if(!was)wrap.classList.add('open');});const drop=wrap.querySelector('.dropdown');for(const item of items){if(!item){drop.appendChild(Object.assign(document.createElement('div'),{className:'divider'}));continue;}const [label,action,shortcut]=item;const b=document.createElement('button');b.className='menuitem';b.dataset.action=action;b.innerHTML='<span>'+label+'</span><span class="shortcut">'+shortcut+'</span>';b.addEventListener('click',()=>act(action));drop.appendChild(b);}menus.appendChild(wrap);}const picker=document.createElement('input');picker.type='file';picker.accept='.txt,text/plain';picker.id='picker';picker.hidden=true;document.body.appendChild(picker);picker.addEventListener('change',async()=>{const f=picker.files&&picker.files[0];picker.value='';if(!f)return;try{const text=await f.text();cmd({op:'OPEN',filename:f.name,text});}catch(e){notice='Could not read the selected file. OPEN was not executed.';render();}});

ed.addEventListener('select',syncSelect);ed.addEventListener('mouseup',syncSelect);ed.addEventListener('keyup',syncSelect);
