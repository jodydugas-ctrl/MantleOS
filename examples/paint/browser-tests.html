<!doctype html><html lang="en"><meta charset="utf-8"><title>Mantle Paint browser fixture</title>
<style>body{font:14px system-ui;background:#eff3f7;margin:20px;color:#182332}button{padding:8px 16px}iframe{display:block;width:780px;max-width:100%;height:600px;border:1px solid #abc;margin-top:15px}pre{white-space:pre-wrap;background:white;padding:15px;border:1px solid #abc}h1{font-size:22px}</style>
<h1>KPP / XP Paint browser fixture</h1><p>Runs authored DOM-event and Canvas checks on a synthetic document. Uses a separate recovery key; no real user painting, network or model is involved. These checks are distinct from native XP parity and manual pointer testing.</p>
<button id="run">Run browser checks</button><button id="download" hidden>Save test receipt</button><pre id="results" aria-live="polite">Ready.</pre><iframe id="app" src="index.html?fixture=1" title="Synthetic Paint test app"></iframe>
<script>
'use strict';
const frame=document.getElementById('app'),output=document.getElementById('results');
document.getElementById('run').onclick=async()=>{
 const button=document.getElementById('run');button.disabled=true;
 const w=frame.contentWindow,d=w.document,api=w.PaintApp,C=w.PaintCore,checks=[];
 const assert=(value,message)=>{if(!value)throw Error(message);};
 const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
 const color=(x,y)=>C.hex(api.state.raster.get(x,y));
 function pointer(type,x,y,options={}){const canvas=d.getElementById('drawing'),box=canvas.getBoundingClientRect();canvas.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse',button:options.button||0,buttons:type==='pointerup'?0:options.button===2?2:1,clientX:box.left+(x+.5)*api.state.zoom,clientY:box.top+(y+.5)*api.state.zoom,shiftKey:!!options.shift}));}
 function drag(x0,y0,x1,y1,options={}){pointer('pointerdown',x0,y0,options);pointer('pointermove',x1,y1,options);pointer('pointerup',x1,y1,options);}
 async function reset(){await api.ready;await api.state.queue;const s=api.state;s.gesture=s.curve=s.polygon=s.selection=s.clipboard=null;s.raster=new C.Raster(80,60);s.history=new C.History(s.raster);s.memory=await new C.Memory('browser-fixture-'+checks.length).init();await s.memory.append('birth',{imageSha256:await C.hash(s.raster.data)});s.queue=Promise.resolve();s.fg='#000000';s.bg='#ffffff';s.width=1;s.mode='outline';s.opaque=true;s.zoom=1;s.grid=false;s.awake=true;s.dirty=false;s.memoryError=null;d.getElementById('sleep-screen').hidden=true;api.selectTool('pencil');}
 async function run(name,fn){try{await reset();await fn();await api.state.queue;checks.push({name,result:'PASS'});}catch(error){checks.push({name,result:'FAIL',error:error.message});}output.textContent=JSON.stringify({running:true,checks},null,2);}
 await run('All sixteen tools and twenty-eight palette colors are usable',()=>{assert(d.querySelectorAll('[data-tool]').length===16,'tool count');assert(d.querySelectorAll('.swatch').length===28,'palette count');for(const b of d.querySelectorAll('[data-tool]')){b.click();assert(api.state.tool===b.dataset.tool,'tool route');}});
 await run('Pencil pointer events paint connected pixels',()=>{drag(2,2,30,2);assert(color(10,2)==='#000000','line missing');assert(color(10,3)==='#ffffff','pencil too thick');});
 await run('Right palette click and right drawing use background',()=>{d.querySelector('[aria-label="Color #ff0000"]').dispatchEvent(new w.MouseEvent('contextmenu',{bubbles:true,cancelable:true}));drag(2,3,30,3,{button:2});assert(color(10,3)==='#ff0000','right color');});
 await run('Rectangle filled with background and outlined in foreground',()=>{api.selectTool('rect');api.state.bg='#ff0000';api.state.mode='both';drag(5,5,30,25);assert(color(5,5)==='#000000','outline');assert(color(15,15)==='#ff0000','fill');});
 await run('Shift constrains ellipse to a circle',()=>{api.selectTool('ellipse');api.state.mode='solid';drag(5,5,30,15,{shift:true});assert(color(18,18)==='#000000','circle center');assert(color(5,5)==='#ffffff','circle corner');});
 await run('Fill and eyedropper act on raster bytes',()=>{api.state.fg='#0000ff';api.selectTool('fill');pointer('pointerdown',1,1);api.state.fg='#ff0000';api.selectTool('picker');pointer('pointerdown',1,1);assert(api.state.fg==='#0000ff','picker');assert(api.state.tool==='pencil','picker returns to pencil');});
 await run('Brush and eraser produce distinct editable marks',()=>{api.selectTool('brush');drag(10,10,30,10);assert(color(20,10)==='#000000','brush');api.selectTool('eraser');drag(18,8,18,15);assert(color(18,10)==='#ffffff','eraser');});
 await run('Airbrush is stopped on pointer release',async()=>{api.selectTool('spray');drag(20,20,25,25);const bytes=Array.from(api.state.raster.data);await new Promise(resolve=>setTimeout(resolve,100));assert(same(bytes,Array.from(api.state.raster.data)),'spray continued');assert(api.state.raster.data.some((v,i)=>i%4!==3&&v===0),'spray blank');});
 await run('Rectangular selection moves pixels and leaves background',()=>{api.state.raster.rect(5,5,15,15,'#ff0000','#ff0000','solid');api.commit('fixture-source');api.selectTool('select');drag(5,5,15,15);drag(10,10,30,25);assert(color(5,5)==='#ffffff','source not cleared');assert(color(25,20)==='#ff0000','selection not moved');});
 await run('Free-form selection retains its polygon mask',()=>{api.state.raster.clear('#ff0000');api.commit('fixture-source');api.selectTool('free');pointer('pointerdown',10,5);pointer('pointermove',30,25);pointer('pointermove',5,25);pointer('pointermove',10,5);pointer('pointerup',10,5);assert(api.state.selection.mask.some(v=>v===0),'lasso has no mask');assert(api.state.selection.mask.some(v=>v===1),'lasso empty');});
 await run('Cut copy paste and undo redo preserve pixels',()=>{api.state.raster.put(4,4,'#0000ff');api.commit('fixture-source');api.perform('selectall');api.perform('cut');assert(color(4,4)==='#ffffff','cut');api.perform('paste');assert(color(4,4)==='#0000ff','paste');api.perform('undo');assert(color(4,4)==='#ffffff','undo');api.perform('redo');assert(color(4,4)==='#0000ff','redo');});
 await run('Curve accepts two bend gestures and finishes',()=>{api.selectTool('curve');drag(5,30,60,30);drag(20,20,25,5);drag(45,30,45,50);assert(!api.state.curve,'curve unfinished');assert(color(5,30)==='#000000'&&color(60,30)==='#000000','curve endpoints');});
 await run('Polygon closes on a double click',()=>{api.selectTool('polygon');drag(10,10,50,10);pointer('pointerdown',30,40);pointer('pointerup',30,40);d.getElementById('drawing').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));assert(!api.state.polygon,'polygon unfinished');assert(color(30,10)==='#000000','polygon top');});
 await run('Text becomes raster pixels and can be undone',()=>{api.selectTool('text');drag(5,5,70,40);const input=d.getElementById('text-editor');assert(!input.hidden,'text box absent');input.value='XP';input.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',ctrlKey:true,bubbles:true,cancelable:true}));assert(input.hidden,'text not committed');assert(api.state.raster.data.some((v,i)=>i%4!==3&&v<200),'text missing');api.perform('undo');assert(api.state.raster.data.every((v,i)=>i%4===3||v===255),'text undo');});
 await run('Zoom and grid affect view without resampling pixels',()=>{const before=Array.from(api.state.raster.data);api.perform('zoom4');api.perform('grid');assert(d.getElementById('workspace').classList.contains('grid'),'grid absent');assert(d.getElementById('drawing').style.width==='320px','zoom CSS');assert(same(before,Array.from(api.state.raster.data)),'zoom changed pixels');});
 await run('Image Attributes dialog pads without scaling',()=>{api.state.raster.put(2,2,'#ff0000');api.commit('fixture-source');api.perform('attributes');d.getElementById('image-width').value='100';d.getElementById('image-height').value='70';d.getElementById('dialog-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));assert(api.state.raster.w===100&&api.state.raster.h===70,'dimensions unchanged');assert(color(2,2)==='#ff0000'&&color(99,69)==='#ffffff','resize damaged pixels');});
 await run('Free-form transformation preserves its mask',()=>{api.state.raster.clear('#0000ff');api.state.selection={x:5,y:5,image:new C.Raster(3,3,'#ff0000'),mask:new Uint8Array([1,0,0,1,0,0,1,1,1])};api.state.raster.paste(api.state.selection,5,5);api.commit('fixture-source');api.perform('flip');d.getElementById('transform-kind').value='flipH';d.getElementById('dialog-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));assert(color(6,6)==='#0000ff','unselected pixels overwritten');assert(api.state.selection.mask!==null,'mask discarded');});
 await run('Invalid image dimensions leave active picture intact',()=>{api.state.raster.put(2,2,'#ff0000');api.commit('fixture-source');api.perform('attributes');d.getElementById('image-width').value='2048';d.getElementById('image-height').value='2048';d.getElementById('dialog-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));assert(api.state.raster.w===80&&color(2,2)==='#ff0000','invalid resize damaged Body');d.getElementById('dialog-close').click();});
 await run('Canvas PNG encoder and decoder preserve raster pixels',async()=>{api.state.raster.put(3,3,'#ff0000');api.commit('fixture-source');const image=new w.Image();image.src=d.getElementById('drawing').toDataURL('image/png');await image.decode();const temp=d.createElement('canvas');temp.width=image.width;temp.height=image.height;const t=temp.getContext('2d');t.drawImage(image,0,0);assert(same(Array.from(t.getImageData(0,0,temp.width,temp.height).data),Array.from(api.state.raster.data)),'PNG differs');});
 await run('Stasis blocks drawing; resumption restores useful Body',async()=>{api.perform('stasis');drag(3,3,30,3);assert(color(15,3)==='#ffffff','stasis accepted input');api.perform('resume');drag(3,3,30,3);assert(color(15,3)==='#000000','resume failed');await api.state.queue;assert(api.state.memory.events.some(e=>e.kind==='stasis'),'stasis not remembered');});
 await run('Organism restore preserves identity and appends return experience',async()=>{drag(3,3,30,3);await api.state.queue;const packet=await api.project(),id=packet.identity,n=packet.memory.events.length;await api.receiveOrganism(JSON.stringify(packet));await api.state.queue;assert(api.state.memory.id===id,'identity changed');assert(api.state.memory.events.length===n+1,'restore did not append');assert(color(15,3)==='#000000','pixels missing');});
 await run('Corrupt incoming memory leaves active picture intact',async()=>{drag(3,3,30,3);await api.state.queue;const packet=await api.project(),before=Array.from(api.state.raster.data),id=api.state.memory.id;packet.memory.events[0].kind='forged';let rejected=false;try{await api.receiveOrganism(JSON.stringify(packet));}catch{rejected=true;}assert(rejected,'tampering admitted');assert(api.state.memory.id===id&&same(before,Array.from(api.state.raster.data)),'active Body changed');});
 const report={schema:'mantle.paint-browser-tests/1',result:checks.every(c=>c.result==='PASS')?'PASS':'FAIL',checks,scope:'Authored synthetic DOM-event, browser Canvas and local-memory checks; not native Windows XP equivalence or human acceptance',userAgent:navigator.userAgent};
 output.textContent=JSON.stringify(report,null,2);button.disabled=false;const save=document.getElementById('download');save.hidden=false;save.onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='paint-browser-receipt.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
};
</script></html>
